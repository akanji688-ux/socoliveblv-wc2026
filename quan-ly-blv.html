<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Quản lý BLV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0D0A2A;color:#eee;min-height:100vh;padding:20px 16px;}
.wrap{max-width:680px;margin:0 auto;}
h1{font-size:18px;font-weight:700;color:#FFD700;margin-bottom:3px;}
.sub{font-size:11px;color:#666;margin-bottom:16px;}
.status{display:none;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);min-width:280px;max-width:90vw;padding:14px 24px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.6);animation:slideUp .3s ease;}
.toast.ok{background:#00A651;color:#fff;border:2px solid #00d466;}
.toast.err{background:#CC0000;color:#fff;border:2px solid #ff4444;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(16px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);min-width:280px;max-width:90vw;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:slideUp .3s ease;}
.toast.ok{background:#00A651;color:#fff;border:2px solid #00d466;}
.toast.err{background:#CC0000;color:#fff;border:2px solid #ff4444;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;display:flex;gap:10px;}
.card-left{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
.card-left img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#111;}
.btn-upload{background:rgba(255,255,255,.08);color:#aaa;border:1px solid rgba(255,255,255,.12);padding:3px 8px;border-radius:4px;cursor:pointer;font-size:9px;}
input[type=file]{display:none;}
.card-right{flex:1;min-width:0;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.card-name{font-size:13px;font-weight:700;color:#fff;}
.btn-del{background:#CC0000;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:10px;}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.field{display:flex;flex-direction:column;gap:2px;}
.field.full{grid-column:span 3;}
.field.half{grid-column:span 1;}
.field label{font-size:9px;color:#666;letter-spacing:.3px;text-transform:uppercase;}
.field input{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:4px 7px;color:#fff;font-size:11px;width:100%;}
.field input:focus{outline:none;border-color:#FFD700;}
.bottom{display:flex;gap:8px;}
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;}
.btn-save{background:#00A651;color:#fff;}
.btn-add{background:#1844C8;color:#fff;}
.hint{font-size:10px;color:#444;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
<h1>⚙️ Quản lý BLV</h1>
<p class="sub">Chỉnh sửa → nhấn <b>Lưu & Đồng bộ</b> (~1 phút)</p>
<div id="status" class="status"></div>
<div class="cards" id="cardList"></div>
<div class="bottom">
  <button class="btn btn-add" onclick="addBLV()">+ Thêm</button>
  <button class="btn btn-save" onclick="saveAll()">💾 Lưu & Đồng bộ</button>
</div>
<p class="hint">Cloudflare tự deploy sau khi lưu</p>
</div>

<script>
var TOKEN=localStorage.getItem('gh_tok')||'';
var REPO='akanji688-ux/socoliveblv-wc2026';
var FILE='blv-data.json';
var blvData=[],fileSha='';

function saveToken(){
  var t=document.getElementById('tokenInput').value.trim();
  if(!t){showStatus('err','Vui lòng nhập token!');return;}
  localStorage.setItem('gh_tok',t);
  TOKEN=t;
  document.getElementById('tokenBar').style.borderColor='rgba(0,166,81,.5)';
  showStatus('ok','✅ Token đã lưu!');
}
// Load saved token on DOM ready
document.addEventListener('DOMContentLoaded',function(){
  var t=localStorage.getItem('gh_tok');
  if(t){TOKEN=t;var bar=document.getElementById('tokenBar');if(bar)bar.style.borderColor='rgba(0,166,81,.3)';}
});
function showStatus(type,msg){
  var old=document.getElementById('toast-msg');
  if(old)old.remove();
  var t=document.createElement('div');
  t.id='toast-msg';
  t.className='toast '+type;
  t.textContent=msg;
  document.body.appendChild(t);
  var dur=type==='ok'?3000:6000;
  setTimeout(function(){
    t.style.transition='opacity .4s';
    t.style.opacity='0';
    setTimeout(function(){if(t.parentNode)t.remove();},400);
  },dur);
}
function esc(s){return (s||'').replace(/"/g,'&quot;');}
function upd(i,key,val){blvData[i][key]=val;if(key==='name')document.querySelector('#card-'+i+' .card-name').textContent=val||'';}
function removeBLV(i){blvData.splice(i,1);renderCards();}
function addBLV(){blvData.push({name:'BLV Mới',img:'',nhom:'#',tele:'#',zalo:'#'});renderCards();}

function renderCards(){
  var html='';
  blvData.forEach(function(b,i){
    html+='<div class="card" id="card-'+i+'">';
    html+='<div class="card-left">';
    html+='<img id="preview-'+i+'" src="'+esc(b.img)+'" onerror="this.style.opacity=.2"/>';
    html+='<label class="btn-upload" for="file-'+i+'">📷 Đổi ảnh</label>';
    html+='<input type="file" id="file-'+i+'" accept="image/*" onchange="previewImg('+i+',this)"/>';
    html+='</div>';
    html+='<div class="card-right">';
    html+='<div class="card-top"><span class="card-name">'+esc(b.name)+'</span>';
    html+='<div style="display:flex;gap:5px;">';
    html+='<button class="btn-save-card" id="savebtn-'+i+'" onclick="saveOne('+i+')">💾 Lưu</button>';
    html+='<button class="btn-del" onclick="removeBLV('+i+')">✕</button>';
    html+='</div></div>';
    html+='<div class="fields">';
    html+='<div class="field half"><label>Tên BLV</label><input value="'+esc(b.name)+'" oninput="upd('+i+',\'name\',this.value)"/></div>';
    html+='<div class="field half" style="grid-column:span 2"><label>Link ảnh</label><input value="'+esc(b.img)+'" oninput="upd('+i+',\'img\',this.value)"/></div>';
    html+='<div class="field half"><label>👥 Nhóm</label><input value="'+esc(b.nhom)+'" oninput="upd('+i+',\'nhom\',this.value)"/></div>';
    html+='<div class="field half"><label>✈️ Telegram</label><input value="'+esc(b.tele)+'" oninput="upd('+i+',\'tele\',this.value)"/></div>';
    html+='<div class="field half"><label>💬 Zalo</label><input value="'+esc(b.zalo)+'" oninput="upd('+i+',\'zalo\',this.value)"/></div>';
    html+='</div></div></div>';
  });
  document.getElementById('cardList').innerHTML=html;
}

function previewImg(i,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    document.getElementById('preview-'+i).src=e.target.result;
    document.getElementById('preview-'+i).style.opacity=1;
    uploadImage(i,file,e.target.result);
  };
  reader.readAsDataURL(file);
}

function uploadImage(i,file,dataUrl){
  var b64=dataUrl.split(',')[1];
  var path='image/BLV/'+file.name;
  showStatus('ok','Đang upload ảnh...');
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json'}
  })
  .then(function(r){return r.ok?r.json():null;})
  .then(function(ex){
    var body={message:'Upload: '+file.name,content:b64};
    if(ex&&ex.sha)body.sha=ex.sha;
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{
      method:'PUT',headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.content){blvData[i].img=path;showStatus('ok','✅ Upload xong: '+file.name);}
    else showStatus('err','Lỗi: '+(d.message||'unknown'));
  })
  .catch(function(e){showStatus('err','Lỗi: '+e.message);});
}

function saveOne(i){
  var btn=document.getElementById('savebtn-'+i);
  if(btn){btn.disabled=true;btn.textContent='Đang lưu...';}
  showStatus('ok','Đang lưu BLV '+blvData[i].name+'...');
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json','Cache-Control':'no-cache'}
  })
  .then(function(r){return r.json();})
  .then(function(latest){
    fileSha=latest.sha||fileSha;
    // Merge: update only this card in the latest data
    var latestBlvs=JSON.parse(decodeURIComponent(escape(atob(latest.content.replace(/\n/g,'')))));
    latestBlvs.blvs[i]=blvData[i];
    blvData=latestBlvs.blvs;
    var b64=btoa(unescape(encodeURIComponent(JSON.stringify({blvs:blvData},null,2))));
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify({message:'Admin: cập nhật '+blvData[i].name,content:b64,sha:fileSha})
    });
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(btn){btn.disabled=false;btn.textContent='💾 Lưu';}
    if(d.content){fileSha=d.content.sha;showStatus('ok','✅ Đã lưu '+blvData[i].name+'! Site cập nhật sau ~1 phút.');}
    else showStatus('err','Lỗi: '+(d.message||JSON.stringify(d)));
  })
  .catch(function(e){if(btn){btn.disabled=false;btn.textContent='💾 Lưu';}showStatus('err','Lỗi: '+e.message);});
}

function saveAll(){
  showStatus('ok','Đang lấy SHA mới nhất...');
  // Always fetch latest SHA before saving to avoid conflicts
  fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
    headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json','Cache-Control':'no-cache'}
  })
  .then(function(r){return r.json();})
  .then(function(latest){
    fileSha=latest.sha||fileSha;
    showStatus('ok','Đang lưu...');
    var b64=btoa(unescape(encodeURIComponent(JSON.stringify({blvs:blvData},null,2))));
    var body={message:'Admin: cập nhật BLV',content:b64,sha:fileSha};
    return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+TOKEN,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body:JSON.stringify(body)
    });
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.content){fileSha=d.content.sha;showStatus('ok','✅ Đã lưu! Site cập nhật sau ~1 phút.');}
    else showStatus('err','Lỗi: '+(d.message||JSON.stringify(d)));
  })
  .catch(function(e){showStatus('err','Lỗi: '+e.message);});
}

fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
  headers:{'Authorization':'token '+TOKEN,'Accept':'application/vnd.github.v3+json'}
})
.then(function(r){return r.json();})
.then(function(d){
  fileSha=d.sha||'';
  blvData=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))))).blvs||[];
  renderCards();
})
.catch(function(){blvData=[];renderCards();showStatus('err','Không tải được dữ liệu.');});
</script>
</body>
</html>
